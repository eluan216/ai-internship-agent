name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  test-and-eval:
    name: Tests + Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: pytest tests/ -v --tb=short

      - name: Demo evaluation (15 queries)
        run: python evaluation/evaluate.py

      - name: Mocked multi-source evaluation
        run: python evaluation/evaluate_multisource.py

      - name: Demo CLI smoke
        run: python cli.py --demo -k "machine learning internship" -n 5
